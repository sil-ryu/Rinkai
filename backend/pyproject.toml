[project]
name = "rinkai-backend"
version = "0.1.0"
description = "Rinkai data proxy: caches and normalizes space data sources for the game."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits real external APIs (skipped unless RINKAI_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
